<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raster to SVG Converter</title>
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
    <div class="main-layout">
        <div class="viewer-area">
            <div id="imageContainer" class="image-container">
                <div id="placeholderText" class="placeholder-text" data-i18n="placeholder">Carica un'immagine per iniziare</div>
                <!-- Images will be injected here -->
            </div>
            
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p id="loadingStatus" data-i18n="processing">Elaborazione in corso...</p>
                <div class="progress-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <p id="progressPercentage">0%</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h2 data-i18n="appTitle">Immagine -> SVG</h2>
                <div class="language-switcher">
                    <button id="langIt" class="lang-btn active">IT</button>
                    <button id="langEn" class="lang-btn">EN</button>
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="control-group">
                    <label for="imageInput" class="custom-file-upload" data-i18n="chooseImage">
                        Scegli Immagine
                    </label>
                    <input type="file" id="imageInput" accept="image/jpeg, image/png, image/gif">
                    <div id="fileName" class="file-name" data-i18n="noFile">Nessun file</div>
                </div>

                <div class="control-group">
                    <label for="colorSlider"><span data-i18n="colorsTitle">Numero dei colori SVG</span>: <span id="colorValue">12</span></label>
                    <input type="range" id="colorSlider" min="1" max="30" value="12">
                </div>

                <button id="convertBtn" disabled data-i18n="convertBtn">Converti in SVG</button>
                <a id="downloadBtn" class="button hidden" download="converted.svg" data-i18n="downloadBtn">Scarica SVG</a>

                <div id="paletteContainer" class="hidden" style="margin-top: 40px;">
                    <h3 data-i18n="paletteTitle">Palette</h3>
                    <div id="paletteGrid" class="palette-grid"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="https://github.com/robottini/Raster2SVG" target="_blank" class="github-link">
                    <svg height="24" width="24" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    <span>GitHub Repository</span>
                </a>
            </div>
        </div>
    </div>

    <script src="/static/script.js?v=4"></script>
</body>
</html>
