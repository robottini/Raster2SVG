name: Release Desktop Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            kind: macos
            rust_targets: aarch64-apple-darwin
            artifact_name: package-macos-aarch64
          - label: macOS Intel
            platform: macos-latest
            kind: macos
            rust_targets: x86_64-apple-darwin
            artifact_name: package-macos-x64
          - label: Windows x64
            platform: windows-latest
            kind: windows
            rust_targets: ""
            artifact_name: package-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Configure macOS signing mode
        if: matrix.kind == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo "MACOS_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
            echo "::notice::Using Apple Developer ID signing and notarization."
          else
            echo "MACOS_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::Missing Apple signing secrets: ${missing[*]}. Publishing an ad-hoc signed macOS DMG."
          fi

      - name: Import Apple Developer ID certificate
        if: matrix.kind == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ "${MACOS_SIGNING_MODE:-adhoc}" != "developer-id" ]]; then
            echo "Skipping Apple Developer ID certificate import for ad-hoc macOS package."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/rastersvg-signing.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$CERT_ID" ]]; then
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            echo "::error::No Developer ID Application certificate found in imported keychain."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build macOS DMG
        if: matrix.kind == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/package_macos_dmg.sh ${{ matrix.rust_targets }}

      - name: Build Windows installer
        if: matrix.kind == 'windows'
        run: pnpm exec tauri build --bundles nsis

      - name: Verify macOS signing and notarization
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          APP_PATH="src-tauri/target/${{ matrix.rust_targets }}/release/bundle/macos/RasterSVG.app"
          DMG_PATH="$(find "src-tauri/target/${{ matrix.rust_targets }}/release/bundle/dmg" -name '*.dmg' -print -quit)"

          if [[ -z "$DMG_PATH" ]]; then
            echo "::error::No macOS DMG found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          if [[ "${MACOS_SIGNING_MODE:-adhoc}" == "developer-id" ]]; then
            spctl --assess --type execute --verbose=4 "$APP_PATH"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          else
            codesign -dv --verbose=4 "$APP_PATH"
            echo "::notice::macOS app is ad-hoc signed and not notarized. Gatekeeper may require users to remove quarantine after download."
          fi

      - name: Upload macOS package artifact
        if: matrix.kind == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.rust_targets }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows package artifact
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error

      - name: Delete macOS signing keychain
        if: always() && matrix.kind == 'macos'
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          TITLE="RasterSVG ${TAG}"
          NOTES_FILE="$(mktemp)"

          printf '%s\n\n' "RasterSVG desktop packages for macOS and Windows." > "$NOTES_FILE"
          printf '%s\n' "- macOS packages are DMG images." >> "$NOTES_FILE"
          printf '%s\n' "- macOS DMGs are ad-hoc signed when Apple Developer ID secrets are not configured. If macOS says the app is damaged, copy it to Applications and run: xattr -dr com.apple.quarantine /Applications/RasterSVG.app" >> "$NOTES_FILE"
          printf '%s\n' "- When Apple Developer ID secrets are configured, macOS DMGs are signed and notarized." >> "$NOTES_FILE"
          printf '%s\n' "- Windows uses the NSIS installer." >> "$NOTES_FILE"
          printf '%s\n' "- The native app does not bundle Python or scientific Python libraries." >> "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --draft=false --latest
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE" --latest
          fi
