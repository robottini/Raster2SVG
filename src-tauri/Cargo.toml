[package]
name = "rastersvg"
version = "0.1.5"
description = "RasterSVG desktop application"
authors = ["RasterSVG contributors"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "rastersvg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
